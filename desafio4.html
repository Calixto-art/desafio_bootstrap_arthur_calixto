
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 04 - Formulários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-4">Cadastro de Atendimento</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" placeholder="João" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Sobrenome</label>
                                <input type="text" class="form-control" placeholder="Silva" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Usuário</label>
                                <div class="input-group">
                                    <span class="input-group-text">@</span>
                                    <input type="text" class="form-control" placeholder="joaosilva">
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Telefone / WhatsApp</label>
                                <div class="input-group">
                                    <span class="input-group-text">+55</span>
                                    <input type="tel" class="form-control" placeholder="(00) 00000-0000" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Valor Estimado</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" class="form-control" placeholder="0,00" step="0.01">
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Tipo de Serviço</label>
                                <select class="form-select" required>
                                    <option selected disabled value="">Escolha uma opção ...</option>
                                    <option value="1">Manutenção</option>
                                    <option value="2">Conserto</option>
                                    <option value="3">Instalação</option>
                                    <option value="4">Avaliação Técnica</option>
                                    <option value="5">Outros</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Observações</label>
                                <textarea class="form-control" rows="4" placeholder="Descreva os detalhes do atendimento..."></textarea>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" id="termos" class="form-check-input" required>
                                    <label for="termos" class="form-check-label">
                                        Estou ciente das informações fornecidas e autorizo o registro do atendimento.
                                    </label>
                                </div>
                            </div>

                            <div class="col-12 mt-4">
                                <button class="btn btn-success w-100" type="submit">Finalizar Cadastro</button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
